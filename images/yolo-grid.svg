t-size="13" fill="#fff" font-weight="600">good 0.96</text><rect x="255" y="147" width="84" height="82" fill="none" stroke="#d64545" stroke-width="3"/><rect x="255" y="127" width="70.8" height="20" fill="#d64545"/><text x="260" y="142" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" fill="#fff" font-weight="600">bad 0.91</text><path d="M405 165 L450 165" stroke="#8794a8" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8794a8"/></marker></defs><text x="540" y="125" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="18" fill="#1c2430" text-anchor="middle" font-weight="700">One pass</text><text x="540" y="150" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="15" fill="#1c2430" text-anchor="middle" font-weight="400">over the whole picture</text><text x="540" y="195" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="15" fill="#1c2430" text-anchor="middle" font-weight="400">gives every box,</text><text x="540" y="215" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="15" fill="#1c2430" text-anchor="middle" font-weight="400">label and score</text><text x="210" y="325" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" fill="#8794a8" text-anchor="middle" font-weight="400">YOLO splits the picture into a grid and checks every cell at once</text></svg>