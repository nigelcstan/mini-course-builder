<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 385" role="img" aria-label="Simplified neural network: an apple picture goes through layers that find edges, shapes and parts, then a classifier gives a label and score"><rect width="660" height="385" rx="10" fill="#f4f7fb"/><text x="40" y="60" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="15" fill="#1c2430" text-anchor="middle" font-weight="400">Input</text><g transform="translate(18,75) scale(0.6)"><path d="M50 25 C30 10 5 25 8 55 C10 85 35 100 50 92 C65 100 90 85 92 55 C95 25 70 10 50 25 Z" fill="#d64545" stroke="#00000033" stroke-width="2"/><path d="M50 25 C50 16 52 10 56 5" stroke="#5a3a1a" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M56 12 C66 2 80 4 82 10 C72 18 62 18 56 12 Z" fill="#3f9b4b"/><path d="M22 38 C26 30 34 28 38 30" stroke="#ffffff88" stroke-width="5" fill="none" stroke-linecap="round"/></g><rect x="130" y="100.0" width="50" height="170" rx="5" fill="#0b6e99" opacity="0.35"/><text x="155" y="305" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1c2430" text-anchor="middle" font-weight="400">Look for</text><text x="155" y="322" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1c2430" text-anchor="middle" font-weight="400">edges</text><path d="M185 185 L215 185" stroke="#8794a8" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="110.0" width="50" height="150" rx="5" fill="#0b6e99" opacity="0.5"/><text x="245" y="305" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1c2430" text-anchor="middle" font-weight="400">Look for</text><text x="245" y="322" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1c2430" text-anchor="middle" font-weight="400">shapes</text><path d="M275 185 L305 185" stroke="#8794a8" stroke-width="2" marker-end="url(#a)"/><rect x="310" y="120.0" width="50" height="130" rx="5" fill="#0b6e99" opacity="0.6499999999999999"/><text x="335" y="305" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1c2430" text-anchor="middle" font-weight="400">Look for</text><text x="335" y="322" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1c2430" text-anchor="middle" font-weight="400">parts</text><path d="M365 185 L395 185" stroke="#8794a8" stroke-width="2" marker-end="url(#a)"/><rect x="400" y="130.0" width="50" height="110" rx="5" fill="#0b6e99" opacity="0.7999999999999999"/><text x="425" y="305" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1c2430" text-anchor="middle" font-weight="400">Combine</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8794a8"/></marker></defs><path d="M460 185 L495 185" stroke="#8794a8" stroke-width="2" marker-end="url(#a)"/><rect x="505" y="130" width="130" height="38" rx="6" fill="#2e9d57"/><text x="570" y="155" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Good apple 97%</text><rect x="505" y="200" width="130" height="38" rx="6" fill="#d64545" opacity=".5"/><text x="570" y="225" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">Bad apple 3%</text><text x="210" y="360" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8794a8" text-anchor="middle" font-weight="400">Feature extractor (finds patterns)</text><text x="570" y="360" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="14" fill="#8794a8" text-anchor="middle" font-weight="400">Classifier</text></svg>