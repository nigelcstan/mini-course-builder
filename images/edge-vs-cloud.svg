<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 345" role="img" aria-label="Cloud computing sends pictures far away to a big computer, while edge computing checks them on the device itself"><rect width="700" height="345" rx="10" fill="#f4f7fb"/><text x="180" y="40" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="19" fill="#1c2430" text-anchor="middle" font-weight="700">Cloud computing</text><text x="520" y="40" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="19" fill="#1c2430" text-anchor="middle" font-weight="700">Edge computing</text><line x1="350" y1="20" x2="350" y2="330" stroke="#d5dde8" stroke-width="2"/><g fill="#0b6e99"><circle cx="150" cy="95" r="26"/><circle cx="180" cy="77" r="32"/><circle cx="214" cy="95" r="26"/><rect x="150" y="95" width="64" height="26"/></g><text x="180" y="100" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="400">big computer</text><rect x="66" y="260" width="48" height="36" rx="5" fill="#8794a8"/><line x1="90" y1="260" x2="180" y2="125" stroke="#8794a8" stroke-dasharray="5 4"/><rect x="156" y="260" width="48" height="36" rx="5" fill="#8794a8"/><line x1="180" y1="260" x2="180" y2="125" stroke="#8794a8" stroke-dasharray="5 4"/><rect x="246" y="260" width="48" height="36" rx="5" fill="#8794a8"/><line x1="270" y1="260" x2="180" y2="125" stroke="#8794a8" stroke-dasharray="5 4"/><text x="180" y="325" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1c2430" text-anchor="middle" font-weight="400">Pictures travel far away to be checked</text><g fill="#9aa9bd"><circle cx="490" cy="95" r="26"/><circle cx="520" cy="77" r="32"/><circle cx="554" cy="95" r="26"/><rect x="490" y="95" width="64" height="26"/></g><text x="520" y="100" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="400">cloud (optional)</text><rect x="406" y="250" width="48" height="36" rx="5" fill="#2e9d57"/><text x="430" y="276" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">AI</text><rect x="496" y="250" width="48" height="36" rx="5" fill="#2e9d57"/><text x="520" y="276" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">AI</text><rect x="586" y="250" width="48" height="36" rx="5" fill="#2e9d57"/><text x="610" y="276" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">AI</text><text x="520" y="325" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="13" fill="#1c2430" text-anchor="middle" font-weight="400">The checking happens on the spot</text></svg>